[package]
name = "yezi-xianpu"
version = "0.4.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows-sys = { version = "0.61", features = ["Win32_Globalization", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
